<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepotsav 2026 - Redirecting...</title>
  <script>
    (function() {
      const pathname = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      const base = 'https://deeputsav-rmlau-online2026.github.io/event-pass-project/';

      if (pathname.includes('Department/Print_Data') || pathname.includes('Print_Data')) {
        window.location.replace(base + 'Department/Print_Data.html' + search + hash);
      } else if (pathname.includes('admin')) {
        window.location.replace(base + 'admin.html' + search + hash);
      } else {
        window.location.replace(base + 'pass.html' + search + hash);
      }
    })();
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding-top:50px;">
  <p>लोड हो रहा है... कृपया प्रतीक्षा करें...</p>
</body>
</html>

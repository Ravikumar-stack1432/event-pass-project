<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepotsav 2026 - Bulk Pass Print (सभी पास प्रिंट करें)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #334155;
      font-family: 'Hind', sans-serif;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .top-controls {
      position: sticky;
      top: 0;
      z-index: 999;
      background: #0f172a;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .top-controls h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
    }

    .btn-ctrl {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-print { background: #16a34a; color: white; }
    .btn-print:hover { background: #15803d; }
    .btn-back { background: #e2e8f0; color: #1e293b; }
    .btn-back:hover { background: #cbd5e1; }

    .print-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 30px;
    }

    .sheet {
      position: relative;
      width: min(210mm, 100%);
      max-width: 530px;
      aspect-ratio: 210 / 297;
      margin: 0 auto;
      padding: 0;
      background-color: #ffffce;
      background-image: linear-gradient(
        to right,
        #e6ab0075,
        #fffbbf,
        #e6ab0075
      );
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      container-type: inline-size;
      page-break-after: always;
      break-after: page;
    }

    .top-panel {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 31.5%;
      background: radial-gradient(
        circle at top center,
        #fffbbf 0%,
        #ffcc00 50%,
        #e6ab00 100%
      );
      clip-path: polygon(0 0, 100% 0, 100% 67%, 50% 100%, 0 67%);
      z-index: 1;
    }

    .top-panel::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40%;
      background: repeating-linear-gradient(
        55deg,
        #a42624 0 2.2mm,
        #f2c64c 2.2mm 4.4mm
      );
      clip-path: polygon(0 0, 50% 100%, 100% 0, 100% 24%, 50% 100%, 0 24%);
    }

    .seal {
      position: absolute;
      z-index: 3;
      left: 8.7%;
      top: 2.2%;
      width: 17%;
      height: 10.7%;
      object-fit: contain;
      border-radius: 50%;
    }

    .event-logo {
      position: absolute;
      z-index: 3;
      right: 5%;
      top: 1.2%;
      width: 36%;
      height: 13%;
      object-fit: contain;
    }

    .university {
      position: absolute;
      z-index: 3;
      left: 4%;
      top: 14.3%;
      width: 92%;
      text-align: center;
      color: #8e2025;
      font-size: clamp(12px, 4.3cqw, 36px);
      font-weight: 800;
      line-height: 1.4;
      text-shadow: 0 1px 0 #f3d76b;
    }

    .card-title {
      position: absolute;
      z-index: 3;
      top: 22.2%;
      left: 25%;
      width: 50%;
      text-align: center;
      font-weight: 700;
      color: #f5e8b5;
      font-size: clamp(12px, 3.8cqw, 32px);
      text-shadow: 0 1px 1px #76632c;
      clip-path: polygon(
        0% 0%,
        100% 0%,
        80% 100%,
        20% 100%
      );
      background: #a38243b3;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.2);
    }

    .portrait-frame {
      position: absolute;
      z-index: 4;
      left: 34.5%;
      top: 26.8%;
      width: 31%;
      height: 23.4%;
      padding: 1mm;
      background: #b99a3e;
      border: 1mm solid #e2ca76;
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-number {
      position: absolute;
      z-index: 4;
      top: 31.5%;
      right: 3%;
      width: 30%;
      font-size: clamp(10px, 3.3cqw, 28px);
      font-weight: 700;
      color: #2d2922;
      text-align: center;
      white-space: nowrap;
    }

    .qr {
      position: absolute;
      z-index: 4;
      top: 35.3%;
      right: 7%;
      width: 19.5%;
      height: 13.8%;
      padding: 1mm;
      background: #fff;
      border: 1.2mm solid #b89b43;
      object-fit: contain;
    }

    .details {
      position: absolute;
      z-index: 4;
      top: 53.4%;
      left: 20%;
      width: 82%;
      color: #29251e;
      font-size: clamp(10px, 3.35cqw, 28px);
      font-weight: 500;
      line-height: 1.6;
    }

    .details .line {
      display: flex;
      align-items: flex-start;
      gap: 0.5em;
      margin: 0.35% 0;
    }

    .details .label {
      flex: 0 0 27%;
      white-space: nowrap;
      font-weight: 600;
    }

    .details .value {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .signature-row {
      position: absolute;
      z-index: 4;
      left: 0;
      bottom: 4.5%;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 2px solid #972626;
      border-bottom: 1px solid #a68c3d;
      background: linear-gradient(180deg, #ffcc00 0%, #fffbbf 50%, #e6ab00 100%);
      text-align: center;
      color: #302b20;
      font-size: clamp(8px, 2.05cqw, 17px);
      font-weight: 600;
      align-items: center;
    }

    .signature-row > div {
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      border-right: 1px solid #972626;
      line-height: 1;
      padding: 1mm;
    }

    .signature-row > div:last-child {
      border-right: none;
    }

    .signature-row img {
      display: block;
      width: auto;
      max-width: 90%;
      height: 36px;
      object-fit: contain;
      margin: 0 auto 2px;
    }

    @media screen and (max-width: 768px) {
      .signature-row img {
        height: 20px !important;
      }
      .sign-1 {
        width: 50px !important;
        height: 20.8px !important;
      }
    }

    .emergency {
      position: absolute;
      z-index: 5;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4.5%;
      background: #be2730;
      color: #fff3dc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 500;
      font-size: clamp(9px, 3.3cqw, 28px);
      white-space: nowrap;
      padding: 0 1%;
    }

    .fine-border {
      position: absolute;
      inset: 1.5mm;
      pointer-events: none;
      z-index: 8;
    }

    @media print {
      .top-controls {
        display: none !important;
      }
      body {
        background: white !important;
        padding: 0 !important;
      }
      .print-container {
        padding: 0 !important;
        gap: 0 !important;
      }
      .sheet {
        width: 210mm !important;
        height: 297mm !important;
        max-width: 100% !important;
        aspect-ratio: auto !important;
        margin: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
      }
    }
  </style>
</head>
<body>

  <div class="top-controls">
    <div>
      <h1>🖨️ Bulk Passes Print View (<span id="passCountDisp">0</span> Passes)</h1>
      <small style="color: #94a3b8;">Har pass alag A4 page par print hoga with Unique QR Code & ID</small>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="admin.html" class="btn-ctrl btn-back">⬅️ Back to Admin</a>
      <button onclick="window.print()" class="btn-ctrl btn-print">🖨️ Print All Passes (PDF)</button>
    </div>
  </div>

  <div class="print-container" id="passContainer">
    <div style="color:white; padding:40px; text-align:center;">Passes load ho rahe hain...</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      let list = [];
      try {
        list = JSON.parse(localStorage.getItem('all_saved_passes')) || [];
      } catch (e) { list = []; }

      const countDisp = document.getElementById('passCountDisp');
      const container = document.getElementById('passContainer');

      if (countDisp) countDisp.textContent = list.length;

      if (!list || list.length === 0) {
        container.innerHTML = `
          <div style="color:white; text-align:center; padding:50px;">
            <h3>Koi saved pass nahi mila.</h3>
            <p>Admin panel me jakar "⚡ Generate 100 Passes" karein aur phir yahan aakar print karein.</p>
            <a href="admin.html" class="btn-ctrl btn-back" style="margin-top:15px; display:inline-block;">Admin Portal par jayein</a>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map((item, idx) => {
        const idVal = item.id || ('G09-' + (5700 + idx));
        const nameVal = item.name || 'स्वयंसेवक ' + (idx + 1);
        const roleVal = item.role || 'स्वयंसेवक';
        const dutyVal = item.duty || 'राम की पैड़ी घाट नं : 9';
        const mobVal = item.mob || '9161914850';
        const deptVal = item.dept || 'Dr Rammanohar Lohia Awadh University Ayodhya';
        const photoVal = item.photo || 'profile.jpg';
        const passLink = item.link || `https://deeputsav-rmlau-online2026.github.io/event-pass-project/Department/Print_Data.html?id=${encodeURIComponent(idVal)}&n=${encodeURIComponent(nameVal)}&r=${encodeURIComponent(roleVal)}&d=${encodeURIComponent(dutyVal)}&m=${encodeURIComponent(mobVal)}`;

        const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=2&data=' + encodeURIComponent(passLink);

        return `
          <main class="sheet" id="pass-card-${idx}">
            <div class="top-panel"></div>
            <img class="seal" src="Department/seal.png" alt="University Seal">
            <img class="event-logo" src="Department/event-logo.png" alt="Deepotsav Logo">
            <div class="university">डॉ. राममनोहर लोहिया अवध विश्वविद्यालय<br>दीपोत्सव 2026, अयोध्या</div>
            <div class="card-title">परिचय पत्र</div>

            <div class="portrait-frame">
              <img src="${photoVal}" alt="${nameVal}" onerror="this.src='profile.jpg'">
            </div>

            <div class="badge-number">क्र.${idVal.startsWith('क्र.') ? idVal.replace('क्र.','') : idVal}</div>
            <img class="qr" src="${qrSrc}" alt="QR Code">

            <section class="details">
              <div class="line"><div class="label">नाम:</div><div class="value">${nameVal}</div></div>
              <div class="line"><div class="label">संस्था/इकाई:</div><div class="value">${deptVal}</div></div>
              <div class="line"><div class="label">मोबाइल नं.:</div><div class="value">${mobVal}</div></div>
              <div class="line"><div class="label">तैनाती स्थल:</div><div class="value">${dutyVal}</div></div>
              <div class="line"><div class="label">दायित्व:</div><div class="value">${roleVal}</div></div>
            </section>

            <div class="signature-row pt-2">
              <div>
                <span class="d-inline-flex">
                  प्राधिकृत हस्ताक्षरी <br> संस्था/इकाई <div class="sign-1" style="width: 110px; height: 38.8px;"></div>
                </span>
              </div>
              <div>
                <span class="d-inline-flex">नोडल अधिकारी &nbsp;<img src="Department/sig2.png" alt="नोडल अधिकारी"></span>
              </div>
              <div>
                <span class="d-inline-flex">प्राधिकृत हस्ताक्षरी <br> जिला प्रशासन &nbsp;<img src="Department/sig1.png" alt="जिला प्रशासन"></span>
              </div>
            </div>

            <div class="emergency">आपात संपर्क सूत्र - +91 8808160420&nbsp; / &nbsp;+91 9170838005</div>
            <div class="fine-border"></div>
          </main>
        `;
      }).join('');
    });
  </script>
</body>
</html>
